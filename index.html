<style>
  :root{

    --surface2:#18181d;
    --border:#252530;

  .subtitle{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:6px;font-weight:500}
  .tagbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
  .tag{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:100px;font-size:11px;font-weight:500;letter-spacing:.5px;cursor:pointer;transition:all .2s}

  .cat-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .cat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .cat-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;line-height:1}
  .cat-count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}

  .badge-anuncios{background:rgba(255,107,53,.12);color:#ff6b35}
  .badge-registro{background:rgba(130,115,255,.12);color:#9b8fff}
  .badge-freemium{background:rgba(99,179,237,.12);color:#63b3ed}

  .card-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);animation:slideDown .25s ease}

  .detail-text{font-size:13px;color:#c0bfc8;line-height:1.6;margin-bottom:12px}

  .tip-box strong{color:var(--accent);font-size:10px;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px}
  .card-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .devices{display:flex;gap:6px;flex-wrap:wrap}
  .device-tag{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
  .open-link{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.5px;padding:6px 14px;border-radius:8px;text-decoration:none;transition:all .18s ease;flex-shrink:0}

  .open-link svg{width:11px;height:11px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  .stat{text-align:center}
  .stat-val{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent);letter-spacing:1px}
  .stat-lab{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:500}
  .divider{height:1px;background:linear-gradient(to right,transparent,var(--border),transparent);margin:4px 0 28px}
  .block-section{margin-bottom:20px}
  .block-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:6px 12px;border-radius:8px;display:inline-block;margin-bottom:10px}
  footer{text-align:center;color:var(--muted);font-size:11px;padding-top:24px;border-top:1px solid var(--border);line-height:1.8}
  footer em{font-family:'Playfair Display',serif;color:var(--accent);font-size:13px}
</style>
</head>

function getBadgeClass(b){return{libre:'badge-libre',anuncios:'badge-anuncios',registro:'badge-registro',freemium:'badge-freemium'}[b]||'badge-libre'}

function countTools(){
  let n=0;
  data.forEach(cat=>{
    if(cat.blocks) cat.blocks.forEach(b=>n+=b.platforms.length);
    else n+=cat.platforms.length;
  });
  return n;
}

function renderPlatforms(platforms,color){
  return platforms.map(p=>`
    <div class="platform-card" onclick="toggle(this)">
      <style>.platform-card:hover::before,.platform-card.expanded::before{background:${color}}</style>
      <div class="card-top">
        <div style="flex:1;min-width:0">
          <div class="platform-name">${p.name}</div>
          <div class="platform-best">${p.best}</div>
        </div>
        <span class="platform-badge ${getBadgeClass(p.badge)}">${p.badgeText}</span>
        <span class="chevron">›</span>
      </div>
      <div class="card-detail">
        <div class="detail-label">Qué ofrece</div>
        <div class="detail-text">${p.desc}</div>
        <div class="tip-box"><strong>⚡ Truco pro</strong>${p.tip}</div>
        <div class="card-footer">
          <div class="devices">${p.devices.map(d=>`<span class="device-tag">${d}</span>`).join('')}</div>
          <a class="open-link"
             href="${p.url}"
             target="_blank"
             rel="noopener noreferrer"
             onclick="event.stopPropagation()"
             style="background:${color}18;color:${color};border:1px solid ${color}55">
            Abrir ${EXT_ICON}
          </a>
        </div>
      </div>
    </div>
  `).join('');
}

function renderAll(cats){
  const c=document.getElementById('content');
  c.innerHTML='';
  cats.forEach((cat,ci)=>{
    const s=document.createElement('div');
    s.className='cat-section';
    s.dataset.cat=cat.id;
    s.style.animationDelay=(ci*.07)+'s';

    const totalTools=cat.blocks
      ?cat.blocks.reduce((sum,b)=>sum+b.platforms.length,0)
      :cat.platforms.length;

    let innerHtml='';
    if(cat.blocks){
      innerHtml=cat.blocks.map(block=>`
        <div class="block-section">
          <div class="block-title" style="background:${cat.color}15;color:${cat.color}">${block.label}</div>
          <div class="platforms">${renderPlatforms(block.platforms,cat.color)}</div>
        </div>
      `).join('');
    } else {
      innerHtml=`<div class="platforms">${renderPlatforms(cat.platforms,cat.color)}</div>`;
    }

    s.innerHTML=`
      <div class="cat-header">
        <div class="cat-icon" style="background:${cat.color}18;color:${cat.color}">${cat.icon}</div>
        <div class="cat-title" style="color:${cat.color}">${cat.title}</div>
        <div class="cat-count">${totalTools} herramientas</div>
      </div>
      ${innerHtml}
      ${ci<cats.length-1?'<div class="divider" style="margin-top:28px"></div>':''}
    `;
    c.appendChild(s);
  });
}

function buildTagbar(){
  const tb=document.getElementById('tagbar');
  tb.innerHTML=`<div class="tag active" onclick="filterAll(this)">Todo</div>`;
  data.forEach(cat=>{
    const t=document.createElement('div');
    t.className='tag';
    t.textContent=`${cat.icon} ${cat.title}`;
    t.onclick=function(){filterCat(this,cat.id)};
    tb.appendChild(t);
  });
}

function toggle(card){
  const d=card.querySelector('.card-detail');
  const open=d.classList.contains('open');
  document.querySelectorAll('.card-detail.open').forEach(x=>{x.classList.remove('open');x.closest('.platform-card').classList.remove('expanded')});
  if(!open){d.classList.add('open');card.classList.add('expanded');setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'nearest'}),100)}
}
function filterAll(el){
  document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderAll(data);
}
function filterCat(el,id){
  document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderAll(data.filter(c=>c.id===id));
}

// Init
document.getElementById('stat-tools').textContent=countTools();
document.getElementById('stat-cats').textContent=data.length;
buildTagbar();
renderAll(data);
</script>
</body>
</html>
